name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Swift formatting
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - name: Build and pure tests
        run: swift test --jobs 2
      - name: Fixture integration checks
        run: .build/debug/PikminionsApp --check --fixture
      - name: Native desktop fixtures
        run: |
          stale_object=.build/debug/PikminionsApp.build/RemovedSource.swift.o
          trap 'rm -f "$stale_object"' EXIT
          printf 'stale object from a removed source\n' > "$stale_object"
          python3 scripts/build-head-size-fixture.py --check --spawn-check --sleep-check
          test -f "$stale_object"
      - name: Build conversation fixture
        run: python3 scripts/build-bubble-fixture.py
